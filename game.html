    <meta charset="UTF-8">
    <title>POLITICAL GAME</title>
    <style>
        body {
            background: #1b2431;
            color: #f0f4ff;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
        }

        /* --- 📈 ここからゲーム本編（本部）のデザイン --- */
        #gameMainSection {
            margin-top: 30px;
            background: #1d273a;
            border-radius: 14px;
            padding: 20px;
            border: 2px solid #3b4a70;
        }

        /* ステータスバー（支持率やお財布）の並び */
        .status-bar {
            display: flex;
            justify-content: space-between;
            /* 💡 中の文字を左右にバランスよく広げる */
            background: #252f44;
            padding: 12px;

            position: fixed;
            /* 💡 画面に固定する */
            top: 10px;
            /* 💡 画面の一番上から10px下に配置 */
            left: 50%;
            /* 💡 画面の真ん中に持ってくるための魔法のコード(1) */
            transform: translateX(-50%);
            /* 💡 画面の真ん中に持ってくるための魔法のコード(2) */
            width: min(580px, 85%);
            /* 💡 本部画面(container)の幅からはみ出さないサイズに調整 */

            border-radius: 10px;
            font-weight: bold;
            z-index: 100;
            /* 💡 他の部品の裏に隠れないように一番手前に出す */
        }


        .status-item {
            font-size: 1.1rem;
        }

        /* ニュース・イベントが届く黒板のようなエリア */
        .event-box {
            background: #00358a;
            color: #fff;
            border-left: 5px solid #5c8cff;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            min-height: 80px;
            line-height: 1.6;
        }

        /* ２択の選択肢ボタン */
        .choice-container {
            display: flex;
            gap: 12px;
        }

        .choice-btn {
            flex: 1;
            padding: 12px;
            border: 1px solid #5c8cff;
            background: transparent;
            color: #5c8cff;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .choice-btn:hover {
            background: #5c8cff;
            color: #fff;
        }

        /* 🌟 モーダル内の「市ボックス」を横並び（グリッド）にする設定 */
        .modal-city-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            /* 自動で綺麗に並ぶ */
            gap: 10px;
            max-height: 250px;
            /* 縦に長くなりすぎたらスクロール */
            overflow-y: auto;
            padding: 10px 5px;
        }

        /* 🌟 モーダル内の四角い市ボックス */
        .modal-city-box {
            background: #f1f2f6;
            color: #000000;
            border: 2px solid #ced4da;
            border-radius: 6px;
            padding: 12px 5px;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-city-box:hover {
            background: #3498db;
            color: white;
            border-color: #2980b9;
            transform: translateY(-2px);
        }

        /* 🔍 検索窓のデザイン */
        .modal-search-input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 2px solid #ced4da;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .modal-search-input:focus {
            border-color: #3498db;
            outline: none;
        }




        /* 📦 汎用モーダルの背景（画面全体を暗くする） */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        /* モーダルの白い本体箱 */
        .modal-content {
            background: white;
            color: #333;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        /* モーダル内に並ぶボタンの調整 */
        .modal-city-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .modal-city-btn:hover {
            background: #e2e6ea;
            color: #2c3e50;
            font-weight: bold;
        }

        /* 🌟 モーダル内の「都道府県ボックス」用のグリッド設定 */
        .modal-pref-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            /* 市より少し大きめ */
            gap: 12px;
            max-height: 300px;
            overflow-y: auto;
            padding: 10px 5px;
        }

        /* 🌟 モーダル内の四角い都道府県ボックス */
        .modal-pref-box {
            background: #2c3e50;
            color: white;
            border: 2px solid #34495e;
            border-radius: 8px;
            padding: 15px 5px;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-pref-box:hover {
            background: #e67e22;
            /* 選択中っぽくオレンジに光らせる演出 */
            border-color: #d35400;
            transform: translateY(-2px);
        }

        /* ライバルの個別ミニカード */
        .npc-info-card {
            background: #2d3748;
            border: 1px solid #4a5568;
            border-radius: 6px;
            padding: 10px;
            font-size: 12px;
            color: #e2e8f0;
            line-height: 1.4;
        }

        /* 思想のパラメーターをちっちゃく見せるバッジ */
        .ideology-badge {
            display: inline-block;
            padding: 2px 5px;
            border-radius: 4px;
            font-size: 10px;
            background: #4a5568;
            margin-right: 3px;
            margin-top: 4px;
        }

        /* 👑 就任式モーダル専用のアニメーション */
        @keyframes inaugurationFadeIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(20px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes flashLight {

            0%,
            100% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        .inauguration-card {
            animation: inaugurationFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            background: linear-gradient(-45deg, #1a202c, #2d3748, #111c24, #1a202c);
            background-size: 400% 400%;
            animation: flashLight 15s ease infinite;
        }

        /* 🎺 音楽演奏や拍手を表現する音符・紙吹雪エフェクト */
        .celebration-particle {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            animation: confettiFall 4s linear forwards;
        }
    </style>
</head>

<script>
    const cityToDistrictMap = {};
    const SenateMap = {};

    let currentTurn = 1;
    let gameDate = "1848-1-1"; // 日付の変数名がgameDataだと下のデータと被るのでgameDateに修正

    let player = {};
    let iselection = false;
    function updateStatusUI() {
        const y = gameDate.getFullYear();
        const m = String(gameDate.getMonth() + 1).padStart(2, '0');
        const d = String(gameDate.getDate()).padStart(2, '0');

        // 💡 「年月日」をすべて表示し、現在のターン数も合わせて見せることで進捗を分かりやすくします！
        document.getElementById("gameTurn").textContent = `${y}年${m}月${d}日`;
        document.getElementById("xp").textContent = `${player.xp}`;
        document.getElementById("money").textContent = `${player.money}`;

        // 🤖 NPCのステータス画面（モニター）もリアルタイムで更新
        initNPCMonitorUI();
    }

    function initNPCMonitorUI() {
        const tabsContainer = document.getElementById("npcPrefTabs");
        tabsContainer.innerHTML = "";

        const countryKey = localStorage.getItem("poligame_data") ? JSON.parse(localStorage.getItem("poligame_data")).countrySelect || "jp" : "jp";
        const prefNames = Object.keys(country[countryKey].pref);

        prefNames.forEach(prefName => {
            const tab = document.createElement("button");
            tab.type = "button";
            tab.className = "modal-city-box";
            tab.style.padding = "6px 12px";
            tab.style.fontSize = "12px";
            tab.style.margin = "0";
            tab.style.whiteSpace = "nowrap";

            const count = npcs.filter(n => n.pref === prefName).length;
            tab.innerHTML = `${prefName} <span style="color:#ed8936;">(${count})</span>`;

            tab.addEventListener("click", () => {
                tabsContainer.querySelectorAll("button").forEach(b => {
                    b.style.background = "#f1f2f6";
                    b.style.color = "#2c3e50";
                });
                tab.style.background = "#3182ce";
                tab.style.color = "white";

                // 🥩 いきなり出さずに「市」のセレクト画面へ進む！
                renderCityTabs(prefName);
            });

            tabsContainer.appendChild(tab);
        });
    }

    // 🌟 修正2: 選んだ県に所属する「市ボックス」を組み立てる関数
    function renderCityTabs(prefName) {
        const cityTabsContainer = document.getElementById("npcCityTabs");
        const listArea = document.getElementById("npcListArea");

        cityTabsContainer.innerHTML = ""; // 初期化
        cityTabsContainer.style.display = "grid"; // 表示する

        listArea.innerHTML = `<div style="color: #718096; text-align: center; width: 100%; grid-column: 1/-1; padding: 10px;">👉 調べたい『市』のボックスを選択してください。</div>`;

        // 国データからその県にある市のリストを取得
        const countryKey = localStorage.getItem("poligame_data") ? JSON.parse(localStorage.getItem("poligame_data")).countrySelect || "jp" : "jp";
        const citiesInPref = country[countryKey].pref[prefName].cities;

        citiesInPref.forEach(cityName => {
            // その市に何人のNPCが潜伏しているかをカウント
            const npcCountInCity = npcs.filter(n => n.pref === prefName && n.city === cityName).length;

            const cityBox = document.createElement("div");
            cityBox.className = "modal-city-box";
            cityBox.style.padding = "8px 5px";

    // 🌐 総議席200（小選挙区 ＋ 比例）ジャスト配分関数
    function calculatePRBlockSeats(countryKey, totalDistrictSeats, total) {
        const currentCountryData = country[countryKey];
        if (!currentCountryData || !currentCountryData.pref || globalPRBlocks.length === 0) return;

        const prefData = currentCountryData.pref;

        // 全体の目標総議席数
        const TARGET_TOTAL_HOUSE_SEATS = total ?? 465;

        // ★ 比例にあてる総議席数を算出（例: 200 - 117 = 83議席）
        const totalPRSeats = Math.max(0, TARGET_TOTAL_HOUSE_SEATS - totalDistrictSeats);
        prseats = totalPRSeats
        // 1. 全国の総人口を計算
        let totalCountryPop = 0;
        globalPRBlocks.forEach(block => {
            block.pop = block.prefs.reduce((sum, prefName) => {
                return sum + (prefData[prefName]?.pop || 0);
            }, 0);
            totalCountryPop += block.pop;
        });

        if (totalCountryPop === 0) return;

        // 2. 人口比で各ブロックに配分（四捨五入ベース＋合計ジャスト調整）
        let assignedSeatsSum = 0;
        globalPRBlocks.forEach(block => {
            const exactSeats = (block.pop / totalCountryPop) * totalPRSeats;

            // 四捨五入で基本枠を決定（最低1議席は保証）
            block.seats = Math.max(1, Math.round(exactSeats));

            // 四捨五入の誤差（端数）を保持
            block.diff = exactSeats - block.seats;
            assignedSeatsSum += block.seats;
        });

        // 3. 四捨五入のズレで比例合計がズレた場合、端数が大きい/小さい順に1議席ずつ微調整
        let diffSeats = totalPRSeats - assignedSeatsSum;

        if (diffSeats > 0) {
            // 議席が足りない場合：切り捨てられた（diffが大きい）順に1議席追加
            const sorted = [...globalPRBlocks].sort((a, b) => b.diff - a.diff);
            for (let i = 0; i < diffSeats; i++) sorted[i].seats += 1;
        } else if (diffSeats < 0) {
            // 議席が溢れた場合：切り上げられた（diffが小さい）順に1議席削減（1議席未満にはしない）
            const sorted = [...globalPRBlocks].sort((a, b) => a.diff - b.diff);
            let count = 0;
            for (let i = 0; i < sorted.length && count < Math.abs(diffSeats); i++) {
                if (sorted[i].seats > 1) {
                    sorted[i].seats -= 1;
                    count++;
                }
            }
        }

        // 検証ログ
        const finalPRSeats = globalPRBlocks.reduce((s, b) => s + b.seats, 0);
        console.log(`🏛️ 【総議席200】 小選挙区: ${totalDistrictSeats} ＋ 比例: ${finalPRSeats} ＝ 計 ${totalDistrictSeats + finalPRSeats} 議席`);
        globalPRBlocks.forEach(b => console.log(`  ・${b.name}: 比例 ${b.seats} 議席`));
    }

    /**
     * 🌐 比例代表ブロック定義の初期化関数（完全ランダム・汎用版）
     * @param {string} countryKey - 国識別キー
     * @param {number} numBlocks - 作成したい比例ブロックの数（デフォルト 8）
     */
    function initPRBlocks(countryKey, numBlocks = 8) {
        const currentCountryData = country[countryKey];
        if (!currentCountryData || !currentCountryData.pref) {
            console.error(`❌ initPRBlocks: 国データ (${countryKey}) が存在しないか、pref がありません。`);
            return;
        }

        const prefData = currentCountryData.pref;
        const allPrefNames = Object.keys(prefData);

        if (allPrefNames.length === 0) return;

        // 1. 都道府県（地域）リストをフィッシャー–イェーツ法で完全にランダムシャッフル
        const shuffledPrefs = [...allPrefNames];
        for (let i = shuffledPrefs.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffledPrefs[i], shuffledPrefs[j]] = [shuffledPrefs[j], shuffledPrefs[i]];
        }

        // 地域数がブロック数より少ない場合は、地域数に合わせる
        const actualNumBlocks = Math.min(numBlocks, shuffledPrefs.length);

        // 2. シャッフルした地域をグループ分け（均等に分配）
        const rawBlockGroups = Array.from({ length: actualNumBlocks }, () => []);
        shuffledPrefs.forEach((prefName, index) => {
            const groupIndex = index % actualNumBlocks;
            rawBlockGroups[groupIndex].push(prefName);
        });

        // 3. 各グループ内で「人口(pop)が最大の地域」を探してブロック名にする
        globalPRBlocks = rawBlockGroups.map(prefs => {
            let maxPop = -1;
            let topPrefName = prefs[0] || "地域";

            prefs.forEach(pName => {
                const pop = prefData[pName]?.pop || 0;
                if (pop > maxPop) {

                    topPrefName = pName;
                }
            });

            return {
                name: `${topPrefName}ブロック`, // 一番人口が多い地域を代表名にする！
                prefs: prefs,
                pop: 0,
                seats: 0,
                diff: 0
            };
        });

        // 4. 高速参照用マップ (globalPRBlockMap) を更新
        globalPRBlockMap = {};
        globalPRBlocks.forEach(block => {
            block.prefs.forEach(pName => {
                globalPRBlockMap[pName] = block;
            });
        });

        console.log(`🎲 ランダム比例ブロック生成完了 [${countryKey}]: ${globalPRBlocks.length} ブロック`);
        globalPRBlocks.forEach(b => console.log(`  ・${b.name}: 構成地域 -> [${b.prefs.join(", ")}]`));
    }

                    backupVoter.district = Math.floor(Math.random() * districtCount) + 1;
                    backupVoter.districtName = `${prefName} 第${backupVoter.district}区`;

                    allVoters.push(backupVoter);
                }
            }

            prefecture.pop = adjustedPop;
        });
    }

    class Voter {
        constructor(id, pref, city, votePower, type = "一般") {
            this.id = id;
            this.pref = pref;
            this.city = city;
            this.votePower = Math.floor(votePower);
            this.type = type;

            // [経済, 国家, 外交] の思想
            this.ideology = [getRandomRange(1, 100), getRandomRange(1, 100), getRandomRange(1, 100)];

            // 🌟 空にしておき、あとから動的に候補者のIDを追加できるようにする
            this.bonusScore = {};
        }

        /**
         * 思想の近さ ＋ 選挙運動の成果（ボーナス）で投票先を決める
         */
        thinkAndVote(candidates) {
            // 【ガード1】候補者リストが存在しない・空の場合は安全に抜ける
            if (!candidates || !Array.isArray(candidates) || candidates.length === 0) {
                return null;
            }

            let bestCandidate = null;
            let highestScore = -Infinity;

            // 与党・最大野党の判定用IDリスト（文字列変換で安全化）
            const rulingPartyIds = (typeof rulingparty !== "undefined" && Array.isArray(rulingparty))
                ? rulingparty.map(String) : [];
            const largestOppId = (typeof largest_opoosition !== "undefined" && largest_opoosition)
                ? String(largest_opoosition) : null;

            candidates.forEach(candidate => {
                if (!candidate || !candidate.ideology) return;

                // 【修正1】配列形式 [50, 50, 50] でも オブジェクト形式 {axis1, axis2, axis3} でも動く安全取得
                const candAxis1 = Array.isArray(candidate.ideology) ? candidate.ideology[0] : (candidate.ideology.axis1 ?? 50);
                const candAxis2 = Array.isArray(candidate.ideology) ? candidate.ideology[1] : (candidate.ideology.axis2 ?? 50);
                const candAxis3 = Array.isArray(candidate.ideology) ? candidate.ideology[2] : (candidate.ideology.axis3 ?? 50);

                const voterAxis1 = Array.isArray(this.ideology) ? this.ideology[0] : (this.ideology?.axis1 ?? 50);
                const voterAxis2 = Array.isArray(this.ideology) ? this.ideology[1] : (this.ideology?.axis2 ?? 50);
                const voterAxis3 = Array.isArray(this.ideology) ? this.ideology[2] : (this.ideology?.axis3 ?? 50);

                const diffEcon = Math.abs(voterAxis1 - candAxis1);
                const diffNation = Math.abs(voterAxis2 - candAxis2);
                const diffDiplomacy = Math.abs(voterAxis3 - candAxis3);
                const distance = diffEcon + diffNation + diffDiplomacy;

                // 基本スコア（思想が近いほど高得点：最大300点）
                let score = 300 - distance;

                // 🌟 【修正2】政党のゆるい優遇ロジック（第3党の逆転も十分あり得る絶妙な加点！）
                const partyIdStr = String(candidate.partyId);

                if (rulingPartyIds.includes(partyIdStr)) {
                    // 与党：ほんのり優遇 (+25点)
                    score += 25;
                } else if (largestOppId && partyIdStr === largestOppId) {
                    // 最大野党：ほんのり優遇 (+15点)
                    score += 15;
                }
                // ※第3党や無所属へのマイナス補正は撤廃！
                // 思想が有権者とドンピシャ（距離が近い）なら、政党加点を跳ね返して第3党候補が余裕で勝利します！

                if (score > highestScore) {
                    highestScore = score;
                    bestCandidate = candidate;
                }
            });

            // 候補者が選べなかった場合のフォールバック
            if (!bestCandidate) {
                bestCandidate = candidates[0];
            }

            return {
                candidateId: bestCandidate.id,
                candidateName: bestCandidate.name,
                votes: this.votePower || 10000
            };
        }
    }
    // 🏠 1. 都道府県を選択するモーダルを開く
    function startLocationSelection() {
        // 現在ロードされている国データを取得
        const currentCountryData = country[localStorage.getItem("poligame_data") ? JSON.parse(localStorage.getItem("poligame_data")).countrySelect || "jp" : "jp"];
        const prefNames = Object.keys(currentCountryData.pref);

        const modalWrapper = document.createElement("div");

        // 🔍 都道府県の検索窓
        const searchInput = document.createElement("input");
        searchInput.type = "text";
        searchInput.className = "modal-search-input";
        searchInput.placeholder = "🔍 都道府県の名前で検索...";
        modalWrapper.appendChild(searchInput);

        // 🔲 都道府県ボックスのグリッド
        const gridContainer = document.createElement("div");
        gridContainer.className = "modal-pref-grid";

        prefNames.forEach(prefName => {
            const prefBox = document.createElement("div");
            prefBox.className = "modal-pref-box";
            prefBox.innerHTML = `<div>${prefName}</div><small style="font-size:11px; opacity:0.8;">人口:${currentCountryData.pref[prefName].pop}%</small>`;

            // 都道府県が選ばれたら、次は「市の選択モーダル」へ進む
            prefBox.addEventListener("click", () => {
                openCitySelectionModal(prefName, currentCountryData.pref[prefName]);
            });

            gridContainer.appendChild(prefBox);
        });
        modalWrapper.appendChild(gridContainer);

        // 都道府県のリアルタイム検索
        searchInput.addEventListener("input", (e) => {
            const keyword = e.target.value.toLowerCase().trim();
            gridContainer.querySelectorAll(".modal-pref-box").forEach(box => {
                if (box.textContent.toLowerCase().includes(keyword)) {
                    box.style.display = "block";
                } else {
                    box.style.display = "none";
                }
            });
        });

        // 🌟 汎用モーダルで「都道府県選択」を表示
        showModal("どこの都道府県で活動しますか？", modalWrapper, []);
    }

    // 🌆 2. 市を選択するモーダルを開く
    function openCitySelectionModal(prefName, prefectureData) {
        const modalWrapper = document.createElement("div");

        // 🔍 市の検索窓
        const searchInput = document.createElement("input");
        searchInput.type = "text";
        searchInput.className = "modal-search-input";
        searchInput.placeholder = `🔍 ${prefName}の市名で検索...`;
        modalWrapper.appendChild(searchInput);

        // 🔲 市ボックスのグリッド
        const gridContainer = document.createElement("div");
        gridContainer.className = "modal-city-grid";

        prefectureData.cities.forEach(cityName => {
            const cityBox = document.createElement("div");
            cityBox.className = "modal-city-box";
            cityBox.textContent = cityName;

            // 市が決定したら居住地を確定し、初期ボーナス計算へ！
            cityBox.addEventListener("click", () => {
                player.pref = prefName;
                player.city = cityName;

                // 🎁 初期ボーナスを付与して結果画面を出す
                giveInitialBonus(prefName, cityName);
            });

            gridContainer.appendChild(cityBox);
        });
        modalWrapper.appendChild(gridContainer);

        // 市のリアルタイム検索
        searchInput.addEventListener("input", (e) => {
            const keyword = e.target.value.toLowerCase().trim();
            gridContainer.querySelectorAll(".modal-city-box").forEach(box => {
                if (box.textContent.toLowerCase().includes(keyword)) {
                    box.style.display = "block";
                } else {
                    box.style.display = "none";
                }
            });
        });

        // 🌟 汎用モーダルを上書きして「市選択」を表示（戻るボタン付き）
        showModal(
            `${prefName} のどの市にしますか？`,
            modalWrapper,
            [{ text: "⬅ 選び直す", className: "", callback: startLocationSelection, keepOpen: true }]
        );
    }

    // 🎁 3. 初期ボーナスを計算してゲームを開始する
    function giveInitialBonus(prefName, cityName) {
        console.log(`🏠 プレイヤーの居住地確定: ${prefName} ${cityName}`);

        // 🗳️ 天才Voterシステムとの連動！
        // 地元の全有権者（Voter）たちの、プレイヤーに対する好感度を最初から一律「+30（地元補正）」にする！
        let localVoterCount = 0;
        allVoters.forEach(voter => {
            if (voter.pref === prefName && voter.city === cityName) {
                voter.bonusScore["player"] = 30; // プレイヤーへの基礎好感度
                localVoterCount++;
            }

        // 結果表示メッセージ
        const bonusHtml = `
        <div style="text-align: left; line-height: 1.6;">
            <p><b>${prefName}${cityName}</b>に引っ越しました！</p>
            <hr>
            <p>🎉 <b>【ようこそ！】</b></p>
            <ul>
                <li>💰 <b>資金:</b> ${player.money}円</li>
                <li><b>XP:</b> ${player.xp}</li>

            </ul>
        </div>
    `;
        // 🌟 確定モーダルを表示！
        showModal(
            "住居",
            bonusHtml,
            [{ text: "始めよう！", className: "geo-box", callback: startGameMain }]
        );
        if (mode === "pr") {
            gameEventManager.scheduleNextPresidentialElection(gameDate);
        }
        scheduleNextParlElection();
        scheduleNextSenateElection(gameDate, "gusu");
    }

    // 自動進行用のタイマーIDを保持する変数
    let autoTurnInterval = null;

    // 自動進行を開始する関数
    function startAutoTurn() {
        if (autoTurnInterval !== null) return;

        document.getElementById("start-auto-btn").disabled = true;
        document.getElementById("stop-auto-btn").disabled = false;

        autoTurnInterval = setInterval(() => {
            // 🚨 画面上の「ブロック対象の通知」をチェック
            const hasBlockingNotice = document.querySelectorAll(".block-notice").length > 0;
            if (hasBlockingNotice) {
                console.warn("⚠️ 未処理の重要イベント（ブロック通知）が発生したため、自動進行を停止しました。");
                stopAutoTurn(); // 💡 タイマー自体をしっかり止める
                alert("⚠️ 未処理の重要なイベントがあります。通知をタップして対応してください！");
                return;
            }

            try {
                turnmove();
            } catch (error) {
                console.error("turnmoveの実行中にエラーが発生しました:", error);
                stopAutoTurn(); // エラー時は安全のため自動停止
            }
        }, 10);
    }

    // 自動進行を停止する関数
    function stopAutoTurn() {
        if (autoTurnInterval !== null) {
            clearInterval(autoTurnInterval);
            autoTurnInterval = null;
        }

        document.getElementById("start-auto-btn").disabled = false;
        document.getElementById("stop-auto-btn").disabled = true;
    }
